name: apk

# Gera o APK de debug (instalável direto no tablet/celular Android,
# habilitando "Instalar apps desconhecidos"). O debug é assinado automaticamente
# com a chave do próprio Gradle — suficiente para instalação local.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug, instalável)
        run: gradle -p android assembleDebug --no-daemon

      - name: Empacotar artefato
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ClickDireto-v2.0.0.apk
          ls -lh ClickDireto-v2.0.0.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ClickDireto-APK-V2
          path: ClickDireto-v2.0.0.apk
          if-no-files-found: error
