name: ipa

# Gera um .ipa SEM ASSINATURA pronto para o Sideloadly (Windows):
# o Sideloadly assina com a Apple ID gratuita do usuário na instalação.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (Release, iphoneos, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project ClickDireto.xcodeproj \
            -scheme ClickDireto \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO 2>&1 \
            | grep -E "error:|note:|BUILD FAILED|BUILD SUCCEEDED"

      - name: Empacotar .ipa
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "ClickDireto.app")
          echo "APP=$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry ClickDireto-unsigned.ipa Payload
          ls -lh ClickDireto-unsigned.ipa

      - name: Publicar artefato .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ClickDireto-ipa-unsigned
          path: build/ClickDireto-unsigned.ipa
          if-no-files-found: error
